    <style>
        :root {
            --primary: #2d6a4f;
            --primary-light: #40916c;
            --primary-pale: #d8f3dc;
            --ink: #1b2d24;
            --ink-mid: #4a6358;
            --ink-soft: #8aab99;
            --white: #ffffff;
            --border: #d4e9dc;
            --border-dark: #b7d9c3;
            --red: #e05c4b;
            --shadow-md: 0 8px 32px rgba(45,106,79,0.11);
            --radius: 14px;
            --radius-sm: 8px;

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f0f7f2;
            color: var(--ink);
            min-height: 100vh;
        }

        /* STROLLER IMAGE */
        .stroller-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        /* PAYMENT METHODS */
        .payment-methods { display: grid; gap: 10px; }
        .payment-option {
            display: flex; align-items: center; gap: 10px;
            padding: 12px; background: #f8fdf9; border: 1.5px solid var(--border-dark);
            border-radius: 8px; cursor: pointer;
        }
        .payment-option input[type="radio"] {
            width: 18px; height: 18px; accent-color: var(--primary);
        }
        .payment-label { flex: 1; }
        .payment-name { font-weight: 700; font-size: 0.85rem; }
        .payment-desc { font-size: 0.72rem; color: var(--ink-soft); }

        /* TERMS BOX - DARK THEME */
        .terms-box {
            background: #fffdf0; border: 1.5px solid #e8d98a;
            border-radius: 8px; padding: 14px; margin-bottom: 16px;
        }
        .terms-box.agreed {
            background: #1b2d24;
            border-color: #2d6a4f;
        }
        .terms-box.agreed label {
            color: #b7e4c7 !important;
        }
        .terms-check-row {
            display: flex; align-items: flex-start; gap: 10px;
        }
        .terms-check-row input[type="checkbox"] {
            width: 18px; height: 18px; margin-top: 1px;
            accent-color: var(--primary); cursor: pointer;
        }
        .terms-check-row label {
            font-size: 0.78rem; color: #7a6020; cursor: pointer;
            line-height: 1.5; margin: 0; font-weight: 500;
        }

        /* WE ACCEPT LOGOS */
        .we-accept-section {
            background: var(--white); border: 1.5px solid var(--border);
            border-radius: 8px; padding: 14px; margin-bottom: 16px;
        }
        .we-accept-title {
            font-size: 0.72rem; font-weight: 700; color: var(--ink-mid);
            text-transform: uppercase; margin-bottom: 10px;
        }
        .we-accept-logos {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
        }
        .logo-item {
            display: flex; align-items: center; justify-content: center;
            background: #f8fdf9; border: 1px solid var(--border);
            border-radius: 8px; padding: 8px; min-height: 50px;
        }
        .logo-item img {
            max-width: 100%; max-height: 40px; object-fit: contain;
        }

        /* GALLERY */
        .gallery-section {
            background: var(--white); border: 1.5px solid var(--border);
            border-radius: 14px; padding: 16px; margin-bottom: 16px;
        }
        .gallery-title {
            font-family: 'Fraunces', serif; font-size: 0.95rem;
            color: var(--ink); font-weight: 700; margin-bottom: 12px;
        }
        .gallery-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
        }
        .gallery-item {
            aspect-ratio: 1; border-radius: 12px; overflow: hidden;
            background: #f8fdf9; border: 1px solid var(--border);
            cursor: pointer; transition: transform 0.3s;
        }
        .gallery-item:hover { transform: scale(1.05); }
        .gallery-item img {
            width: 100%; height: 100%; object-fit: cover; display: block;
        }
        .gallery-item.empty {
            display: flex; align-items: center; justify-content: center;
            color: var(--ink-soft); font-size: 2rem;
        }

        /* COLOR PICKER */
        .color-picker-group {
            display: flex; gap: 10px; align-items: center; margin-bottom: 12px;
        }
        .color-picker-group input[type="color"] {
            width: 50px; height: 40px; padding: 2px;
            border: 1px solid var(--border-dark); border-radius: 6px; cursor: pointer;
        }

        @media (max-width: 600px) {
            .we-accept-logos { grid-template-columns: repeat(3, 1fr); }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>

    function formatDateToDDMMYYYY(dateString) {
        if (!dateString) return '';
        const date = new Date(dateString + 'T00:00:00');
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');

        return `${day}/${month}/${year}`;
